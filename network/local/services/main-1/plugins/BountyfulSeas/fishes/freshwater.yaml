# Freshwater - rivers and lakes inland.

river_trout:
  lore:
    - "Holds against the current without seeming to move."
  fish_name: "<green>Bachforelle</green>"
  fish_item: "nexo:river_trout"

  max_length: 112
  level: 5

  water_type: [river, lake]
  terrain: [plains]
  vegetation: [cold, temperate]
  depth: [shallow]
  condition: [rain]

  spawn_weight: 90
  rarity: rare

  on_eat:
    saturation: 4
    effects:
      - type: regeneration
        duration: 200
        amplifier: 0

lake_carp:
  fish_name: "<yellow>Seekarpfen</yellow>"
  fish_item: "nexo:lake_carp"
  lore:
    - "Grows old in still water, and grows heavy with it."

  max_length: 125
  level: 6

  water_type: [lake]
  depth: [shallow]

  spawn_weight: 120
  rarity: uncommon

  on_eat:
    saturation: 5
    effects: []

river_dace:
  fish_name: "<aqua>Hasel</aqua>"
  fish_item: "nexo:river_dace"
  lore:
    - "Quick, plain, and everywhere the water runs."

  max_length: 42
  level: 3

  water_type: [river]

  spawn_weight: 130
  rarity: uncommon

  on_eat:
    saturation: 2
    effects: []
