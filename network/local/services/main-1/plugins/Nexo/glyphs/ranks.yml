# Rank glyphs
#
# Two sets live here, and they are not interchangeable:
#
#   1. Chat tags  - typed in chat via a :placeholder:, gated by a permission.
#                   All use the 18px `default/chat` art at height 10 / ascent 9
#                   so every tag sits on the same baseline.
#   2. Rank icons - the 78x20 `medieval_ranks` art, inserted by character
#                   (rank prefixes, menus). No placeholder, so normal chat
#                   cannot trigger them.
#
# Never change a `char` that is already in use - it is stored in rank prefixes
# and baked into the generated resource pack.


# ---------------------------------------------------------------------------
# 1. Chat tags
# ---------------------------------------------------------------------------

