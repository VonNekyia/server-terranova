# Cavefish - water that has never seen the sky.

blind_cave_loach:
  fish_name: "<dark_aqua>Blinde Grundschmerle</dark_aqua>"
  fish_item: "nexo:blind_cave_loach"
  lore:
    - "Has no eyes worth the name, and no use for them."
    - "It knew the cave before the cave had a name."

  min_weight: 0.1
  max_weight: 0.9

  min_length: 6
  max_length: 24

  water_type: [cave]

  spawn_weight: 60
  rarity: rare

  on_eat:
    saturation: 3
    effects:
      - type: night_vision
        duration: 400
