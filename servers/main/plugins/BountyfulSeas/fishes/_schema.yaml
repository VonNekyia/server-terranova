# Field reference for every fish category in this folder.
#
# This file defines no fish - it is comments only, and the loader reads it as an
# empty category. Name real files after the category they hold: tropicals.yaml,
# predators.yaml, freshwater.yaml. Sub folders work too.
#
# fish_id:
#   fish_name: ""              # required, MiniMessage
#   fish_item: "nexo:item"     # required, namespaced
#   lore:                      # optional flavour text, italic light grey
#     - "A line of flavour text."
#
#   max_length: 0              # the most this fish ever reaches, in cm
#   # There is no minimum. Every length is rolled from this one number along the
#   # curve in config.yml, and only one catch in a million comes up at it.
#
#   level: 1                   # defaults to 1: the angling level before it bites
#   # A fish above the angler's level is not in the draw at all, so it never takes
#   # a share of the odds it cannot pay out. Levels come from milestone XP.
#
#   water_type: [ocean, river, lake, cave]
#   terrain:    [desert, swamp, plains]
#   vegetation: [cold, temperate, warm]
#   depth:      [shallow, deep]
#   modifier:   [coral, ice, swarm]
#               coral/ice are matched against the water at the spot.
#               swarm means the fish moves: it gathers in a few regions at a
#                 time and shifts on a timer, so it is only catchable where its
#                 swarm currently is. Swarm regions are gold on the web map.
#   condition:  [rain, storm, night, day]
#
#   bait_locked: false         # defaults to false
#   spawn_weight: 100          # defaults to 100, 0 disables the fish
#   rarity: uncommon           # required
#   # [uncommon, rare, misc, epic, legendary, treasure, mythic, signature]
#   # misc and treasure are not fish and carry no length.
#   # Tier is rolled first, from rarity-chances in config.yml, then an entry
#   # inside it by spawn_weight.
#
#   on_eat:                    # leave out entirely to make a fish inedible
#     saturation: 0
#     effects:
#       - type: regeneration   # any effect the server knows
#         duration: 200        # ticks, required
#         amplifier: 0         # optional, 0 is the first tier
#
# Every trait list is a filter. Leaving one out, or leaving it empty, places no
# restriction on that axis - a fish with no water_type can be caught anywhere.
