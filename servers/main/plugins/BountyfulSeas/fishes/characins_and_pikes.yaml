# Salmler & Hechte - Freshwater ambush and pack hunters.

# Blinder Höhlenfisch — Astyanax mexicanus, Höhlenform
# Rekordlänge (TL): 12 cm — Quelle: FishBase Species Summary, Astyanax mexicanus
# Lebensraum: dauerhaft dunkle Höhlengewässer und unterirdische Pools in Mexiko
# Wassertiefe: flache bis mittlere Höhlenbecken | Temperatur: subtropisch bis warm
# Aktivität: keine natürliche Bindung an Tageslicht; Leben in permanenter Dunkelheit
blind_cave_tetra:
  lore:
    - "Blind und bleich ertastet er jede Bewegung im Wasser."
  fish_name: "<aqua>Blinder Höhlenfisch</aqua>"
  fish_item: "nexo:blind_cave_tetra"

  max_length: 13
  level: 8

  water_type: [cave]

  spawn_weight: 50
  rarity: "rare"

