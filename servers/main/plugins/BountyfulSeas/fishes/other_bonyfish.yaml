# Uebrige Knochenfische - The ones that fit nowhere else.

# Knochenfische - Bony fish - the ordinary shape of a fish, done well.

# Hering — Clupea harengus
# Rekordlänge (TL): etwa 45 cm — Quelle: FishBase Species Summary, Clupea harengus
# Lebensraum: pelagische Schwärme im Nordatlantik und angrenzenden Meeren
# Wassertiefe: 0–364 m, meist 0–200 m | Temperatur: 0–18 °C | Aktivität: Tag und Nacht
atlantic_herring:
  lore:
    - "Silberne Schuppen verschwinden in einem rastlosen Schwarm."
  fish_name: "<gray>Hering</gray>"
  fish_item: "nexo:atlantic_herring"

  max_length: 46
  level: 1

  water_type: [ocean]
  vegetation: [cold, temperate]
  modifier: [swarm]

  spawn_weight: 140
  rarity: "uncommon"

  on_eat:
    saturation: 3

