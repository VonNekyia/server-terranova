# ---------------------------------------------------------------------------
# Das Terranova-Netzwerk: was laeuft, mit wie viel Speicher, auf welchem Port.
#
# Gelesen von bin/terranova.exe. Nach einer Aenderung zeigt
# "terranova doctor", ob alles zusammenpasst.
# ---------------------------------------------------------------------------

# auto | native | docker
# auto heisst nativ - unter Windows wie unter Linux. Docker wird nie
# gewaehlt, nur weil es installiert ist: wer native Prozesse erwartet, soll
# nicht ploetzlich Container bekommen.
runtime: auto

java:
  # Welches java. Die Umgebungsvariable TERRANOVA_JAVA uebersteuert.
  path: java
  # Mindestens diese Hauptversion - Paper 26.2 schreibt 25 in sein Jar
  # (version.json -> java_version). Ein aelteres java unter path zaehlt als
  # nicht vorhanden.
  version: 25
  # Ist kein passendes Java da, laedt Terranova dieses JRE nach runtime/java
  # herunter - unter Windows wie unter Linux. Die Pruefsummen stammen aus den
  # .sha256.txt, die Adoptium neben jedes Archiv legt.
  download:
    release: "jdk-25.0.4.1+1"
    sha256:
      windows-x64: 4c95451cea98556def2c54f7782933f52a26d4a36bd85e1d59f0364464828b07
      linux-x64: 1731a34baadec5479258ea0202e4d5d865d2efeee60cb0c7d7eb056fe96ca219
      linux-aarch64: 34828cbb93ed31c281c84ecb31ddab655d11a802f263c1fc019d42e9e0230fed
  # docker: welches Image
  image: "eclipse-temurin:25-jre"
  # aikar = die Aikar-Flags, none = nur -Xms/-Xmx
  flags: aikar

# MariaDB und Redis. Unter Windows bringt Terranova beide selbst mit und
# laedt sie beim ersten Start herunter - es gibt dort keine Paketverwaltung,
# auf die man sich verlassen koennte.
#
# Unter Linux andersherum: dort kommen beide aus der Distribution
# (apt install mariadb-server redis-server), und Terranova benutzt, was
# installiert ist. version, sha256 und windows_commit sind dann ohne
# Bedeutung. Das Datenverzeichnis unter runtime/ gehoert trotzdem Terranova -
# eine Systeminstanz auf 3306 bleibt unberuehrt.
deps:
  mariadb:
    version: "11.4.5"
    port: 13306
    # aus archive.mariadb.org/mariadb-11.4.5/winx64-packages/sha256sums.txt
    sha256: b7c11d38657f16b837e68199d73670510aadb78f42dfa5d5fdea31a7aab342e3
    image: "mariadb:11.4.5"
    user: minecraft
    password: minecraft
    # Wer ein Plugin mit eigener Datenbank ergaenzt, traegt sie hier ein -
    # sonst startet es mit "Unknown database". Der Name muss zu dem passen,
    # was das Plugin in seiner Config erwartet:
    #   nations          Nations/config.yml -> name   (auch PlayerActionAdapter)
    #   betonquest       BetonQuest/config.yml -> base
    #   chatcontrol      ChatControl/database.yml -> Database
    #   interactivechat  InteractiveChat/storage.yml -> Database
    #   luckperms        LuckPerms/config.yml -> database
    #   proficisci       Proficisci/config.yml -> database
    #   bountyfulseas    BountyfulSeas/config.yml -> name
    #   husksync         HuskSync/config.yml -> database.credentials.database
    databases: [nations, betonquest, chatcontrol, interactivechat, luckperms, proficisci, bountyfulseas, husksync]

  redis:
    port: 6379
    # HuskSync braucht Redis. Offiziell gibt es Redis fuer Windows nicht;
    # verwendet wird der native Port von zkteco-home, festgenagelt auf den
    # Commit von 8.10.1 - lose Dateien am Zweigende sind kein stabiles Artefakt.
    windows_commit: 794a883a083a317bc23fbbabc83a3c54abab0799
    sha256:
      redis-server.exe: 1372626b3ecbcf654823e52c7235d052dab0a93ec10da9847c3fda0f388d155e
      redis-cli.exe: febc307dfece765e2710c87b3aeda340a240f636a68cb7e8b317c4f3214a8188
    image: "redis:8.8.2"

proxy:
  dir: proxy
  port: 25565
  memory: 512M

# Die festen Server. Verzeichnis: servers/<name> - und dort liegt auch alles,
# was sie brauchen. Bestueckt werden sie nicht: was im Verzeichnis liegt, ist
# was laeuft. Nur server.properties und config/paper-global.yml entstehen beim
# Start neu, aus den .dist-Dateien daneben - in beiden steckt ein Geheimnis.
servers:
  main:  { port: 25566, memory: 4G, stop_timeout: 180s }
  build: { port: 25567, memory: 2G }
  farm:  { port: 25568, memory: 2G }

# RCON je Server auf Port + 100, nur auf 127.0.0.1
rcon_offset: 100

# Die dynamischen Server. Verzeichnis: servers_dynamic/mining-N, bestueckt aus
# templates/common und templates/<template>.
mines:
  template: mining
  # Wie viele Dungeons gleichzeitig offen sein duerfen. Die Eintraege in
  # proxy/velocity.toml zieht Terranova selbst nach - hier genuegt die Zahl.
  slots: 8
  # mining-N laeuft auf 25570 + N
  base_port: 25570
  memory: 2G
  lifetime: 24h
  motd: "Terranova Mine {n}"
  # Ein Dungeon laeuft, solange es ihn gibt: nach einem Neustart des
  # Netzwerks kommt er wieder hoch, nach einem Absturz auch. Von selbst
  # angelegt wird trotzdem keiner - nur 'mine open' legt einen an.
  # Geschlossene bleiben unten und warten aufs Abraeumen.
  resume: true

schedule:
  daily_restart:
    at: "04:00"
    servers: [main, build, farm]
    # nacheinander, damit nie alle gleichzeitig unten sind
    gap: 120s
    warn: 30s
    message: "Neustart in 30 Sekunden."
  reap_every: 15m

dashboard:
  port: 25590
  # stop = Schliessen des Startfensters faehrt das Netzwerk sauber herunter
  # detach = das Netzwerk laeuft ohne Fenster weiter
  on_window_close: stop

web:
  # Die oeffentliche Seite. Ein fertiger Build ohne eigenen Server -
  # Terranova liefert ihn selbst aus, damit daneben kein zweiter Webserver
  # gepflegt werden muss.
  site:
    dir: website
    # 0 schaltet die Auslieferung ab
    port: 8081
    # 127.0.0.1 = nur dieser Rechner. Fuer den oeffentlichen Betrieb hier
    # 0.0.0.0 eintragen - und daran denken, dass dann auch die Firewall und
    # die Portfreigabe im Router mitspielen muessen.
    bind: 127.0.0.1
  # Die Weltkarte laeuft nicht als eigener Dienst, sondern im Pl3xMap-Plugin
  # von main. Terranova startet sie also nicht, sondern sieht nur nach, ob
  # sie antwortet.
  map:
    # muss zu internal-webserver.port in
    # servers/main/plugins/Pl3xMap/config.yml passen
    port: 8080
    server: main
    # Nur zum Anzeigen: worauf der Verweis im Dashboard zeigt. Leer heisst
    # http://127.0.0.1:<port>, also die Karte auf diesem Rechner.
    #
    # Eine oeffentliche Adresse gehoert nur dann hierher, wenn es sie
    # wirklich gibt und sie auf diesen Port zeigt. Stand hier einmal eine
    # fremde Domain, fuehrte der Verweis ins Leere - die Karte lief die
    # ganze Zeit, nur kam niemand hin.
    url: ""
