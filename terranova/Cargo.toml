[package]
name = "terranova"
version = "0.1.0"
edition = "2021"
description = "Startet, beaufsichtigt und stoppt das Terranova-Netzwerk"
publish = false

[[bin]]
name = "terranova"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.2"
sha2 = "0.11"
lexopt = "0.3"

# Nur fuer Signale, /proc-Zeiten und localtime - kein Framework.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
] }

# Klein und schnell gebaut: kein Async-Laufzeitsystem, keine Frameworks.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# Ein Lesethread, der panisch aussteigt, wuerde aufhoeren seine Pipe zu leeren.
# Paper schreibt seine Konsole ueber einen asynchronen Appender - laeuft die
# Pipe voll, blockiert irgendwann der Server-Thread. Lieber stirbt dann der
# ganze Supervisor: die Server laufen weiter und werden beim naechsten Start
# uebernommen.
panic = "abort"
