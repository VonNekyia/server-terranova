<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terranova</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171b22; --sunken: #0c0f14; --raised: #232a35;
    --line: #262d38; --line-soft: #1f242d;
    --fg: #e7ebf2; --dim: #8b93a3;
    --accent: #56c8ff; --ok: #5ecb84; --warn: #e2a844; --bad: #e8635f;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    /* Der Kopf steht fest, die Konsole daneben soll genau bis unten reichen -
       beide rechnen mit derselben Zahl. */
    --head: 57px;
    --gap: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* --- Kopf ---------------------------------------------------------------- */
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    height: var(--head); padding: 0 18px;
    background: rgba(15, 18, 22, .85); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  h1 {
    font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .2px;
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  /* Ein Punkt sagt auf einen Blick, woran man ist - noch bevor man die
     Zeile daneben gelesen hat. */
  .dot {
    width: 8px; height: 8px; border-radius: 99px; background: var(--dim);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, .04);
  }
  .dot.ready { background: var(--ok); box-shadow: 0 0 0 3px rgba(94, 203, 132, .15); }
  .dot.stopping { background: var(--warn); box-shadow: 0 0 0 3px rgba(226, 168, 68, .15); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px rgba(232, 99, 95, .15); }
  .chip {
    font-size: 11px; color: var(--accent); border: 1px solid var(--line);
    background: rgba(86, 200, 255, .08); border-radius: 99px; padding: 1px 8px;
    letter-spacing: .03em;
  }
  .chip:empty { display: none; }
  .grow { flex: 1; }
  .dim { color: var(--dim); }

  /* --- Flaeche ------------------------------------------------------------- */
  main {
    display: grid; gap: var(--gap); padding: var(--gap);
    /* Die zweite Spalte waechst mit dem Fenster, aber nur bis zu einem Mass,
       ab dem ein Konsolenzeile laenger wird als man sie lesen mag. */
    grid-template-columns: minmax(0, 1fr) clamp(340px, 30vw, 620px);
    align-items: start;
  }
  .col { display: grid; gap: var(--gap); min-width: 0; align-content: start; }
  /* Die rechte Spalte bleibt stehen, waehrend links geblaettert wird. Sie ist
     schmaler als die linke, also duerfen die Zellen darin enger sitzen. */
  .side { position: sticky; top: calc(var(--head) + var(--gap)); }
  .side td, .side th { padding: 8px 12px; }
  .side #web td:last-child { text-align: right; }
  section {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .3);
    overflow: hidden;
  }
  section > h2 {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--dim); font-weight: 600;
    margin: 0; padding: 11px 16px; border-bottom: 1px solid var(--line-soft);
  }
  section > h2 .dim { text-transform: none; letter-spacing: 0; font-weight: 500; }
  .hint { color: var(--dim); font-size: 13px; margin: 0; padding: 12px 16px 0; }

  /* --- Tabellen ------------------------------------------------------------ */
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 9px 16px; text-align: left; border-bottom: 1px solid var(--line-soft); }
  thead th {
    font-weight: 500; color: var(--dim); font-size: 11px;
    text-transform: uppercase; letter-spacing: .05em;
    padding-top: 8px; padding-bottom: 8px; background: rgba(255, 255, 255, .015);
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: rgba(255, 255, 255, .022); }
  /* Wer gerade mitliest, soll die Zeile dazu wiederfinden. */
  tbody tr.sel { background: rgba(86, 200, 255, .1); }
  tbody tr.sel td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
  td.name { font-weight: 600; }
  .sub { color: var(--dim); font-size: 12px; font-weight: 400; }
  td.num, th.num { font-variant-numeric: tabular-nums; color: var(--dim); }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 1px 9px 1px 7px; border-radius: 99px; font-size: 12px;
    border: 1px solid currentColor;
    background: color-mix(in srgb, currentColor 11%, transparent);
  }
  .badge::before {
    content: ""; width: 5px; height: 5px; border-radius: 99px; background: currentColor;
  }
  .ready { color: var(--ok); } .stopped { color: var(--dim); }
  .starting, .stopping { color: var(--warn); }
  .crashloop, .conflict, .down { color: var(--bad); }
  .waiting { color: var(--dim); }

  /* Was ein Knoten ist: paper, proxy, db+sql, db+value, dungeon. Ob er
     statisch oder dynamisch ist, sagt schon der Abschnitt, in dem er steht -
     das steht deshalb nicht noch einmal als Schlagwort daneben. */
  .tag {
    display: inline-block; padding: 1px 7px; border-radius: 5px;
    font-size: 11px; color: var(--dim);
    border: 1px solid var(--line); background: rgba(255, 255, 255, .02);
  }
  .tag + .tag { margin-left: 4px; }
  .tag.dungeon { color: #8fd6ff; border-color: rgba(86, 200, 255, .35); background: rgba(86, 200, 255, .08); }
  .tag.proxy { color: #c3a6ff; border-color: rgba(163, 130, 255, .3); background: rgba(163, 130, 255, .08); }
  .tag.db { color: #cbd3e0; border-color: rgba(203, 211, 224, .25); background: rgba(203, 211, 224, .06); }
  .tag.sql { color: #ffc98a; border-color: rgba(226, 168, 68, .3); background: rgba(226, 168, 68, .08); }
  .tag.value { color: #ff9f9c; border-color: rgba(232, 99, 95, .28); background: rgba(232, 99, 95, .07); }
  .tag.paper { color: #9fe3b6; border-color: rgba(94, 203, 132, .28); background: rgba(94, 203, 132, .07); }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .adopted { color: var(--warn); font-size: 12px; }

  /* --- Schaltflaechen ------------------------------------------------------ */
  button {
    background: var(--raised); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 11px; cursor: pointer; font-size: 13px;
    font-family: inherit; transition: border-color .12s, color .12s, background .12s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:active:not(:disabled) { background: #1b212a; }
  button:disabled { opacity: .35; cursor: default; }
  button.primary { color: var(--accent); border-color: rgba(86, 200, 255, .35); background: rgba(86, 200, 255, .1); }
  button.primary:hover:not(:disabled) { background: rgba(86, 200, 255, .18); }
  button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
  .actions { display: flex; gap: 6px; justify-content: flex-end; }

  .bar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 11px 16px; border-top: 1px solid var(--line-soft);
    background: rgba(255, 255, 255, .012);
  }
  .bar input[type=number], .bar select {
    background: var(--sunken); color: var(--fg); font: inherit; font-size: 13px;
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px;
  }
  .bar input[type=number] { width: 58px; }
  .bar input:focus, .bar select:focus { outline: none; border-color: var(--accent); }

  /* --- Konsole ------------------------------------------------------------- */
  /* Sie steht rechts, aber sie nimmt sich nicht den ganzen Bildschirm: ein
     Fenster voll Logzeilen ist keines, das man liest. Wer mehr sehen will,
     zieht sie an der unteren Kante groesser - der Browser kann das selbst. */
  .console { display: flex; flex-direction: column; }
  #console {
    height: clamp(220px, 38vh, 460px); min-height: 120px; margin: 0;
    resize: vertical;
    font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word;
    overflow-y: auto; padding: 12px 16px; background: var(--sunken);
  }
  #console .err { color: var(--bad); }
  #console .sys { color: var(--accent); }
  #console .gap { color: var(--warn); font-style: italic; }
  #console .tip { color: var(--dim); font-style: italic; }
  #console::-webkit-scrollbar { width: 10px; }
  #console::-webkit-scrollbar-thumb { background: #262d38; border-radius: 99px; border: 3px solid var(--sunken); }
  .inputrow {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 16px; border-top: 1px solid var(--line-soft);
  }
  .prompt { color: var(--accent); font: 14px var(--mono); }
  .inputrow input {
    flex: 1; min-width: 0; background: var(--sunken); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; font: 13px var(--mono);
  }
  .inputrow input:focus { outline: none; border-color: var(--accent); }
  .inputrow input:disabled { opacity: .5; }

  #toast {
    position: fixed; right: 20px; bottom: 20px; background: var(--panel);
    border: 1px solid var(--bad); color: var(--bad); padding: 10px 14px;
    border-radius: 8px; max-width: 420px; display: none;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .45);
  }

  /* Schmaler Bildschirm: untereinander, und die Konsole klebt nicht mehr. */
  @media (max-width: 1000px) {
    main { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="dot" id="pulse"></span>
    <h1>Terranova</h1>
    <span class="chip" id="rt"></span>
  </div>
  <span class="dim" id="sub">verbinde…</span>
  <span class="grow"></span>
  <button id="netstart" class="primary">Netzwerk starten</button>
  <button id="netstop" class="danger">Herunterfahren</button>
</header>

<main>
  <div class="col">
    <section>
      <h2>Statische Server</h2>
      <table>
        <thead><tr>
          <th>Name</th><th>Art</th><th>Zustand</th><th class="num">Port</th><th class="num">PID</th>
          <th class="num">Laufzeit</th><th></th>
        </tr></thead>
        <tbody id="nodes"></tbody>
      </table>
    </section>

    <section>
      <h2>Dynamische Server</h2>
      <p class="hint">Dungeons — werden auf Zuruf geöffnet und laufen nach ihrer
        Zeit von selbst aus.</p>
      <table><tbody id="mines"></tbody></table>
      <div class="bar">
        <button id="open" class="primary">Öffnen</button>
        <input type="number" id="count" value="1" min="1" max="99" title="wie viele">
        <select id="template" title="aus welcher Vorlage"></select>
        <span class="dim" id="slots"></span>
        <span class="grow"></span>
        <button id="reap">Abgelaufene abräumen</button>
      </div>
    </section>
  </div>

  <div class="col side">
    <section class="console">
      <h2>Konsole <span class="dim" id="who"></span></h2>
      <pre id="console"><span class="tip">verbinde…</span>
</pre>
      <div class="inputrow">
        <span class="prompt">›</span>
        <input id="cmd" placeholder="Befehl an den Server…" title="Eingabetaste schickt ihn ab" autocomplete="off" disabled>
        <button id="send" class="primary" disabled>Senden</button>
      </div>
    </section>

    <section>
      <h2>Web</h2>
      <table><tbody id="web"></tbody></table>
    </section>
  </div>
</main>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let selected = null, stream = null, ready = false, picked = false;

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 6000);
}

async function api(path, method = "GET", body) {
  const r = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await r.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch { /* kein JSON */ }
  if (!r.ok) throw new Error(data.error || `Fehler ${r.status}`);
  return data;
}

function secs(s) {
  if (s == null) return "–";
  if (s < 90) return s + "s";
  if (s < 5400) return Math.round(s / 60) + "m";
  return Math.floor(s / 3600) + "h" + String(Math.floor((s % 3600) / 60)).padStart(2, "0") + "m";
}

// Die Zeilen werden fortgeschrieben, nicht neu gebaut. Wer eine Tabelle
// alle zwei Sekunden neu aufbaut, zieht dem Benutzer die Schaltflaeche unter
// dem Zeiger weg.
const rows = new Map();

function button(label, fn, danger) {
  const b = document.createElement("button");
  b.textContent = label;
  if (danger) b.className = "danger";
  b.onclick = async () => {
    b.disabled = true;
    try { await fn(); } catch (e) { toast(e.message); }
    b.disabled = false;
    refresh();
  };
  return b;
}

function nodeRow(n) {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td class="name"></td><td class="tags"></td><td></td><td class="num"></td>
                  <td class="num"></td><td class="num"></td>`;
  const td = document.createElement("td");
  td.className = "actions";
  const konsole = button("Konsole", async () => watch(n.name));
  const toggle = button("Stopp", () => api(`/api/nodes/${n.name}/${toggle._stop ? "stop" : "start"}`, "POST"), true);
  const neu = button("Neustart", () => api(`/api/nodes/${n.name}/restart`, "POST"));
  td.append(konsole, toggle, neu);
  tr.append(td);
  const cells = tr.querySelectorAll("td");
  return {
    tr, toggle,
    name: cells[0], tags: cells[1], state: cells[2],
    port: cells[3], pid: cells[4], up: cells[5],
  };
}

// Alles ausser der Einordnung statisch/dynamisch - die sagt schon der
// Abschnitt, in dem die Zeile steht.
function tagHtml(tags) {
  return (tags || [])
    .filter(t => t !== "static" && t !== "dynamic")
    .map(t => `<span class="tag ${t}">${t}</span>`)
    .join("");
}

// Die Vorlagenliste aendert sich nur, wenn jemand einen Ordner anlegt. Neu
// bauen wuerde die Auswahl des Nutzers mitten im Klick zuruecksetzen - also
// erst vergleichen, und die getroffene Wahl ueber die Aktualisierung retten.
function fillTemplates(templates, fallback) {
  const sel = $("#template");
  const same =
    sel.options.length === templates.length &&
    templates.every((t, i) => sel.options[i].value === t);
  if (same) return;
  const chosen = sel.value;
  sel.textContent = "";
  for (const t of templates) {
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t;
    sel.append(o);
  }
  sel.value = templates.includes(chosen) ? chosen : fallback || templates[0] || "";
}

function fillNode(r, n) {
  r.name.textContent = n.name;
  r.tags.innerHTML = tagHtml(n.tags);
  r.state.innerHTML = `<span class="badge ${n.status}">${n.status}</span>` +
    (n.control === "adopted"
      ? ' <span class="adopted" title="lief schon – Befehle gehen über RCON">übernommen</span>'
      : "");
  r.port.textContent = n.port;
  r.pid.textContent = n.pid ?? "–";
  r.up.textContent = secs(n.uptime_s);
  r.tr.classList.toggle("sel", n.name === selected);
  const running = n.status !== "stopped";
  r.toggle._stop = running;
  r.toggle.textContent = running ? "Stopp" : "Start";
  r.toggle.className = running ? "danger" : "";
}

function line(text, kind) {
  const el = $("#console");
  const near = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  const span = document.createElement("span");
  span.className = kind || "";
  span.textContent = text + "\n";
  el.append(span);
  while (el.childNodes.length > 3000) el.removeChild(el.firstChild);
  if (near) el.scrollTop = el.scrollHeight;
}

function watch(name) {
  if (stream) { stream.close(); stream = null; }
  selected = name;
  $("#console").textContent = "";
  $("#who").textContent = "– " + name;
  $("#cmd").disabled = false; $("#send").disabled = false;
  stream = new EventSource(`/api/nodes/${name}/console`);
  for (const kind of ["out", "err", "sys", "gap"]) {
    stream.addEventListener(kind, e => line(e.data, kind));
  }
  stream.onerror = () => line("[Verbindung unterbrochen – wird erneut versucht]", "gap");
}

async function send() {
  const input = $("#cmd");
  const text = input.value.trim();
  if (!text || !selected) return;
  input.value = "";
  try {
    const r = await api(`/api/nodes/${selected}/command`, "POST", { line: text });
    if (r.reply && r.reply.trim()) line(r.reply.trimEnd(), "sys");
  } catch (e) { toast(e.message); }
}

// Website und Weltkarte. Die eine liefert Terranova selbst aus, die andere
// steckt im Server-Prozess von main - deshalb steht hier keine Schaltflaeche
// zum Starten, sondern nur, ob jemand antwortet.
const webRows = new Map();

function fillWeb(w) {
  const want = [];
  if (w && w.site) want.push({
    key: "site", name: "Website", status: "ready", port: w.site.port,
    href: w.site.url,
    note: w.site.public ? "aus dem Netz erreichbar" : "nur dieser Rechner",
  });
  if (w && w.map && w.map.status !== "off") want.push({
    key: "map", name: "Weltkarte", status: w.map.status, port: w.map.port,
    href: w.map.url || w.map.local,
    note: w.map.status === "waiting" ? `wartet auf ${w.map.server} (${w.map.server_status || "stopped"})`
        : w.map.status === "down" ? `${w.map.server} läuft, aber der Kartenport antwortet nicht`
        : w.map.worlds ? `${w.map.worlds} Welten`
        : "noch keine Kacheln gerendert",
  });

  const body = $("#web");
  for (const it of want) {
    let r = webRows.get(it.key);
    if (!r) {
      const tr = document.createElement("tr");
      // Drei Spalten statt fuenf: der Port steht ohnehin im Verweis, und die
      // Bemerkung gehoert unter den Namen - sonst wird die Zeile in der
      // schmalen Spalte rechts zu Kleinholz.
      tr.innerHTML = `<td class="name"><span></span><div class="sub"></div></td><td></td>
                      <td><a target="_blank" rel="noopener"></a></td>`;
      const c = tr.querySelectorAll("td");
      r = {
        tr, name: c[0].firstElementChild, note: c[0].lastElementChild,
        state: c[1], link: c[2].firstElementChild,
      };
      webRows.set(it.key, r);
      body.append(tr);
    }
    r.name.textContent = it.name;
    r.state.innerHTML = `<span class="badge ${it.status}">${it.status}</span>`;
    r.link.textContent = it.href.replace(/^https?:\/\//, "").replace(/\/$/, "");
    r.link.href = it.href;
    r.note.textContent = it.note;
  }
  if (!want.length && !body.childNodes.length) {
    body.innerHTML = `<tr><td class="dim">Nichts eingerichtet.</td></tr>`;
  }
}

async function refresh() {
  try {
    const s = await api("/api/status");
    ready = true;
    $("#rt").textContent = s.runtime;
    const up = s.nodes.filter(n => n.status === "ready").length;
    $("#sub").textContent = s.shutting_down
      ? "fährt herunter…" : `${up} von ${s.nodes.length} bereit`;
    $("#pulse").className = "dot " + (s.shutting_down ? "stopping" : up ? "ready" : "");
    // Beim Laden gleich main mitlesen: das ist der Server, um den es meistens
    // geht, und eine leere Konsole sagt niemandem etwas. Nur einmal - wer
    // danach etwas anderes waehlt, behaelt es.
    if (!picked && !selected) {
      const first = s.nodes.find(n => n.name === "main")
        || s.nodes.find(n => !n.tags?.includes("dynamic") && n.status !== "stopped");
      if (first) { picked = true; watch(first.name); }
    }

    const body = $("#nodes");
    const seen = new Set();
    for (const n of s.nodes) {
      // Dungeons stehen unten unter "Dynamische Server", mit ihrer Restzeit
      // und dem Schliessen-Knopf. Sonst staende jeder offene zweimal da.
      if (n.tags?.includes("dynamic")) continue;
      seen.add(n.name);
      let r = rows.get(n.name);
      if (!r) { r = nodeRow(n); rows.set(n.name, r); body.append(r.tr); }
      fillNode(r, n);
    }
    for (const [name, r] of rows) {
      if (!seen.has(name)) { r.tr.remove(); rows.delete(name); }
    }

    fillWeb(s.web);

    const m = await api("/api/mines");
    $("#slots").textContent = `${m.mines.length} von ${m.slots} Plätzen belegt`;
    fillTemplates(m.templates || [], m.template);
    const mb = $("#mines");
    // Die Dungeon-Liste ist kurz und aendert sich selten - hier genuegt neu
    // zeichnen, solange gerade keine Schaltflaeche gedrueckt wird.
    if (document.activeElement?.tagName !== "BUTTON" || !mb.contains(document.activeElement)) {
      mb.textContent = "";
      if (!m.mines.length) {
        mb.innerHTML = `<tr><td class="dim">Kein Dungeon offen.</td></tr>`;
      }
      for (const mine of m.mines) {
        const tr = document.createElement("tr");
        if (mine.name === selected) tr.className = "sel";
        const slot = mine.name.split("-")[1];
        // Ein offener Dungeon laeuft, solange es ihn gibt. Steht er still,
        // wurde er geschlossen - dann zaehlt die Zeit bis zum Abraeumen.
        tr.innerHTML = `<td class="name">${mine.name}</td>
          <td class="tags">${tagHtml(["paper", "dungeon"])}</td>
          <td>${mine.closed
            ? '<span class="badge stopped">geschlossen</span>'
            : `<span class="badge ${mine.status}">${mine.status}</span>`}</td>
          <td class="num">Port ${mine.port}</td>
          <td class="num">${mine.closed ? "weg in " : "noch "}${secs(mine.expires_in_s)}</td>`;
        const td = document.createElement("td");
        td.className = "actions";
        if (mine.closed) {
          td.append(button("Reopen",
            () => api("/api/mines/open", "POST", { count: 1, slot: +slot })));
        } else {
          if (mine.status !== "stopped") {
            td.append(button("Konsole", async () => watch(mine.name)));
          }
          td.append(button("Schließen", async () => {
            if (!confirm(`${mine.name} schließen? Er bleibt unten und wird in ${secs(m.lifetime_s)} abgeräumt.`)) return;
            await api(`/api/mines/${slot}/close`, "POST");
          }, true));
        }
        // Vorzeitig weg: nicht nur unten, sondern fort. Das trifft die Welt,
        // also fragt es nach - und steht bei jedem, offen wie geschlossen.
        td.append(button("Reaper", async () => {
          if (!confirm(`${mine.name} jetzt abräumen? Die Welt ist danach weg und der Platz frei.`)) return;
          await api(`/api/mines/${slot}/reap`, "POST");
        }, true));
        tr.append(td); mb.append(tr);
      }
    }
  } catch (e) {
    $("#pulse").className = "dot bad";
    if (ready) $("#sub").textContent = "kein Supervisor erreichbar";
    else $("#sub").textContent = e.message;
  }
}

$("#send").onclick = send;
$("#cmd").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
$("#netstart").onclick = async () => {
  try { await api("/api/network/start", "POST"); } catch (e) { toast(e.message); }
};
$("#netstop").onclick = async () => {
  if (!confirm("Das ganze Netzwerk herunterfahren?")) return;
  try { await api("/api/network/stop", "POST"); } catch (e) { toast(e.message); }
};
$("#open").onclick = async () => {
  const body = { count: +$("#count").value || 1 };
  const t = $("#template").value;
  if (t) body.template = t;
  try { await api("/api/mines/open", "POST", body); }
  catch (e) { toast(e.message); }
  refresh();
};
$("#reap").onclick = async () => {
  try {
    // stop_running: ein abgelaufener Dungeon laeuft immer - wer ihn hier
    // ueberspringt, raeumt nie einen ab.
    const r = await api("/api/mines/reap", "POST", { dry_run: false, stop_running: true });
    toast((r.reaped || []).join("  ·  ") || "nichts zu tun");
  } catch (e) { toast(e.message); }
  refresh();
};

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
